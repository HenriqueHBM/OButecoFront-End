<div class="row login-container">
  <div class="col-lg-8 texto">
    <h1>O buteco</h1>
  </div>
  <div class="col-lg-4 formulario-container">
    <form [formGroup]="myForm" (submit)="logar($event)">
      <div class="formulario">
        <mdb-form-control>
          <input
            mdbInput
            type="text"
            id="usuario"
            class="form-control"
            formControlName="usuario"
          />
          <label mdbLabel class="form-label" for="usuario">Usuário</label>
        </mdb-form-control>
        <br />

        <mdb-form-control>
          <input
            mdbInput
            type="password"
            id="senha"
            class="form-control"
            formControlName="senha"
          />
          <label mdbLabel class="form-label" for="senha">Senha</label>
        </mdb-form-control>

        <button type="submit" class="btn btn-dark btn-rounded">
          ACESSAR
        </button>
      </div>
    </form>
  </div>
</div>
