          Cadastrar
      }@else{
          Editar
      }
      Usuário

    <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
  </div>
  <div class="modal-body">
    <div class="row mb-4">
      <div class="col">
        <mdb-form-control>
          <input mdbInput type="text" id="form3Example1" class="form-control" />

        </mdb-form-control>
      </div>
      <div class="col">
        <select class="form-control" required>
          <option value="volvo">Volvo</option>
          <option value="saab">Saab</option>
        </select>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col">
        <mdb-form-control>
          <input mdbInput type="text" id="form3Example1" class="form-control" />
          <label mdbLabel class="form-label" for="form3Example1">Usuário</label>
        </mdb-form-control>
      </div>
      <div class="col">
        <mdb-form-control>
          <input mdbInput type="text" id="form3Example1" class="form-control" />
          <label mdbLabel class="form-label" for="form3Example1">Senha</label>
        </mdb-form-control>
      </div>
    </div>
  </div>
  <div class="modal-footer justify-content-between">
    <button type="button" class="btn btn-secondary" (click)="modalRef.close()">fechar</button>
    <button type="button" class="btn btn-primary">Salvar</button>
