<div class="p-5">
  <div class="card card-body">
    <div class="row">
      <div class="col-md-5 d-flex flex-column">
        <span class="fs-3"> Usuários </span>
        <span class="text-muted text-break"> Tela para controle dos usuários ao sistema </span>
      </div>
      <div class="col md-6 d-flex justify-content-end text-end align-items-center ">
        <a class="btn btn-info mx-2" href="/home/gestao_usuarios/cargos" >
           <i class="fa-solid fa-briefcase me-1"></i> Cargos
        </a>
        <button class="btn btn-success" (click)="openCadastrar()">
          <i class="fa-solid fa-plus me-1"></i> Cadastrar
        </button>
      </div>
    </div>
  </div>
  <br />
  <div class="d-flex justify-content-between">
    <div class="col col-md-3 card card-body ">
      <h5 class="card-title">Total Usuários</h5>
      {{ list_usuarios().length }}
    </div>
    <div class="col col-md-3 card card-body mx-3 ">
      <h5 class="card-title">Ativos</h5>
      {{ list_usuarios().filter(i => i.status == true).length }}
    </div>
    <div class="col col-md-3 card card-body ">
      <h5 class="card-title">Inativos</h5>
      {{ list_usuarios().filter(i => i.status != true).length }}
    </div>
  </div>
  <br />
  <div class="card card-body">
    <!-- [usuarios]="list_usuarios()" /* PROPERTY BINDING: enviando um dado para essa tag nesse "variavel = usuarios" 
         (editar)="openEditar($event)" /* EVENT BINDING: retorno de informacao/dados */ -->
    <app-usuario-table
      [usuarios]="list_usuarios()" 
      (editar)="openEditar($event)"
      (changeStatus)="changeStatus($event)"
      (excluir)="excluirUsuario($event)"
    >

    </app-usuario-table>
  </div>
  <br>
  <div class="row justify-content-start">
    <div class="col-md-1 text-start">
      <button class="btn btn-dark" (click)="backCliked()">
        <i class="fa-solid fa-caret-left"></i> Voltar
      </button>
    </div>
  </div>
</div>
