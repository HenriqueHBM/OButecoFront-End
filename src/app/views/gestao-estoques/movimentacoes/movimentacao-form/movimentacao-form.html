<form [formGroup]="myForm" (submit)="onSubmit($event)">
  <div class="row mb-4">
    <div class="col">
      <select class="form-control" [class.is-invalid]="campoInvalido('tipo')" required formControlName="tipo">
        <option value="TIPO_ENTRADA" selected>Entrada</option>
        <option value="TIPO_SAIDA">Saída</option>
      </select>
      <div class="invalid-feedback">Tipo é obrigatório</div>
    </div>
    <div class="col">
      <mdb-form-control>
        <input mdbInput type="text" id="qtde" class="form-control" [class.is-invalid]="campoInvalido('qtde')" required formControlName="qtde" />
        <label mdbLabel class="form-label" for="qtde">Quantidade</label>
      </mdb-form-control>
      <div class="invalid-feedback">Quantidade é obrigatória</div>
    </div>
  </div>
  <div class="row mb-4">
    <div class="col">
      <mdb-form-control>
        <input
          mdbInput
          type="text"
          id="valorUnitario"
          class="form-control"
          [class.is-invalid]="campoInvalido('valorUnitario')"
          required
          formControlName="valorUnitario"
        />
        <label mdbLabel class="form-label" for="valorUnitario">Val. Unitário</label>
      </mdb-form-control>
      <div class="invalid-feedback">Valor unitário é obrigatório</div>
    </div>
    <div class="col">
      <select class="form-control" [class.is-invalid]="campoInvalido('fk_id_conversao')" required formControlName="fk_id_conversao">
        <option value="1">Quilograma</option>
        <option value="2">Grama</option>
      </select>
      <div class="invalid-feedback">Conversão é obrigatória</div>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col">
      <mdb-form-control>
        <input
          mdbInput
          type="text"
          id="taxaConversao"
          class="form-control"
          formControlName="taxaConversao"
        />
        <label mdbLabel class="form-label" for="taxaConversao">Conversão</label>
      </mdb-form-control>
    </div>
    <!-- <div class="col">
      <mdb-form-control>
        <input mdbInput type="text" id="local" class="form-control" formControlName="local" />
        <label mdbLabel class="form-label" for="local">Local</label>
      </mdb-form-control>
    </div> -->
  </div>

  <div class="row mb-4">
    <div class="col">
      <mdb-form-control class="mb-4">
        <textarea mdbInput class="form-control" id="observacao" rows="4" formControlName="observacao"></textarea>
        <label mdbLabel class="form-label" for="observacao">Observação</label>
      </mdb-form-control>
    </div>
  </div>
  <!-- <div class="modal-footer justify-content-between"> -->
  <!-- <button type="button" class="btn btn-secondary" (click)="modalRef.close()">fechar</button> -->
  <button type="submit" class="btn btn-primary">Salvar</button>
  <!-- </div> -->
</form>
